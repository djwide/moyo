# moyo Configuration File
# This file can be used to override default settings

# Environment settings
environment: development
debug: true

# Core directories
data_dir: data
index_dir: indexes
cache_dir: cache
output_dir: output

# Logging configuration
logging:
  level: INFO
  structured: true
  file_path: logs/moyo.log
  max_size_mb: 100
  backup_count: 5

# Prometheus metrics configuration
prometheus:
  enabled: true
  port: 8000
  path: /metrics
  namespace: moyo
  subsystem: pipeline

# Pipeline configuration
pipeline:
  batch_size: 1000
  max_workers: 4
  chunk_size: 512
  overlap: 50
  timeout_seconds: 300

# Embedding model configuration
embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 32
  normalize: true

# FAISS index configuration
faiss:
  index_type: FlatL2
  dimension: 384
  nlist: 100
  nprobe: 10

# LLM configuration for hypothesis generation
llm:
  provider: openai
  model: gpt-3.5-turbo
  max_tokens: 1000
  temperature: 0.7
  timeout: 30

# Custom configuration for specific components
custom_config:
  fuzzing:
    max_hypotheses_per_campaign: 50
    max_iterations: 10
    similarity_threshold: 0.8

  crawling:
    max_concurrent_requests: 10
    request_delay: 1.0
    user_agent: "MoyoBot/1.0"

  analysis:
    confidence_threshold: 0.7
    max_results_per_query: 100

# Red teaming configuration (moyo-redteam)
red_team:
  # Target LLM — the system under test (NOT the helper LLM)
  target:
    provider: openai          # openai | anthropic | rest
    model: gpt-4o
    api_key: null             # or set env: MOYO_TARGET_API_KEY
    base_url: null            # for custom / proxied endpoints
    timeout: 30
    system_prompt: null       # inject if the target's system prompt is known

  # Helper LLM — used to generate and rephrase attack probes
  helper_provider: openai
  helper_model: gpt-4o-mini
  helper_api_key: null        # or set env: MOYO_HELPER_API_KEY

  # Mode: whitebox (knows secrets) or blackbox (blind exploration)
  mode: whitebox

  # White-box settings
  whitebox:
    secrets_file: data/secrets.json
    attack_strategies:
      - direct
      - indirect
      - roleplay
      - fewshot
      - context
      - authority
    max_probes_per_secret: 5
    similarity_threshold: 0.75   # cosine sim above which response is 'revealed'

  # Black-box settings
  blackbox:
    max_rounds: 10
    hypothesis_source: llm    # llm | public_corpus | manual
    manual_seeds: []
    domain: "technology company"
    specificity_threshold: 0.60  # anomaly score above which response is flagged

  output_dir: output/redteam
