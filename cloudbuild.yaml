# Build + push the Cloud Run worker, then update job moyo-report-worker.
# This file is NOT run on GitHub push. CI (.github/workflows/ci.yml) only
# runs tests. Deploy with:
#   gcloud builds submit --config=cloudbuild.yaml --project=senteguard-website
# Console: https://console.cloud.google.com/cloud-build/builds?project=senteguard-website
#          https://console.cloud.google.com/run/jobs/details/us-central1/moyo-report-worker?project=senteguard-website
#
# Tag with $BUILD_ID (always set). $COMMIT_SHA is empty on a local
# `gcloud builds submit` and produced worker: which Cloud Build rejects.
#
# User-managed Cloud Build SAs require an explicit log destination.
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/senteguard-website/moyo/worker:${BUILD_ID}
      - -t
      - us-central1-docker.pkg.dev/senteguard-website/moyo/worker:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/senteguard-website/moyo/worker:${BUILD_ID}

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/senteguard-website/moyo/worker:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - moyo-report-worker
      - --image
      - us-central1-docker.pkg.dev/senteguard-website/moyo/worker:${BUILD_ID}
      - --region
      - us-central1

images:
  - us-central1-docker.pkg.dev/senteguard-website/moyo/worker:${BUILD_ID}
  - us-central1-docker.pkg.dev/senteguard-website/moyo/worker:latest
