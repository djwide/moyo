name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Verify package imports
        run: |
          python -c "import moyo"
          python -c "import shared_utils"
          python -c "from moyo.privateside.mapcorpus import CorpusBuilder, CorpusConfig"
          python -c "from moyo.publicside.barrierprobe import BarrierAnalyzer, BarrierProbeConfig"

      - name: Run tests
        run: pytest tests/ -v
