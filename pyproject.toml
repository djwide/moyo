[project]
name = "moyo"
version = "0.1.0"
description = "Experimental tooling for corpus mapping and barrier probing"
requires-python = ">=3.10"
dependencies = [
    # Lean core: Cloud Run explore + report worker. ML / ingest live in extras.
    "pydantic>=2,<3",
    "pydantic-settings>=2",
    "pyyaml>=6.0",
    "click",
    "openai>=1.0.0",
    # Keep the transport contract reproducible; newer releases may use httpx2.
    "anthropic==0.64.0",
    "httpx",
    "charset-normalizer>=3",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24",
    "torch>=1.13.0",
]
ingest = [
    "pyahocorasick>=2,<3",
    "python-magic",
    "pdfminer.six>=20221105",
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]
aws = [
    "boto3>=1.26.0",
]
monitoring = [
    "prometheus-client>=0.16.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
]
gui = [
    "PyQt5",
    "matplotlib",
    "scikit-learn",
]
reports = [
    "jinja2>=3.1",
    "weasyprint>=60",
    "google-cloud-storage>=2.14.0",
    "google-auth>=2.0.0",
]
documents = [
    "pdfminer.six>=20221105",
    "python-docx>=0.8.11",
]
cloud = [
    "firebase-admin>=6.5.0",
    "google-auth>=2.0.0",
    "google-cloud-storage>=2.14.0",
]

[project.scripts]
moyo = "moyo.cli:cli"
moyo-datainput = "moyo.privateside.datainput.cli:cli"
moyo-corpus = "moyo.privateside.mapcorpus.cli:cli"
moyo-gather = "moyo.publicside.gatherpublicsources.cli:cli"
moyo-probe = "moyo.publicside.barrierprobe.cli:cli"
moyo-phrases = "moyo.privateside.phrases.cli:cli"
moyo-gui = "moyo.gui.app:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["moyo", "moyo.*", "shared_utils", "shared_utils.*"]
exclude = ["data*", "indexes*"]

[tool.setuptools.package-data]
"moyo.gui" = ["assets/*"]
